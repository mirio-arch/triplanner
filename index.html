<body>
<div id="root"></div>
<script>
/* iPhone ana ekran uygulaması: iOS, durum çubuğu şeffafken sayfayı ekrandan kısa ölçüyor;
   kabuğu ekranın gerçek yüksekliğine göre boyutla. */
(function(){
  if(navigator.standalone !== true) return;
  var d = document.documentElement; d.classList.add("ios-standalone");
  function fit(){
    var portrait = matchMedia("(orientation: portrait)").matches;
    var sh = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    d.style.setProperty("--tp-screen-h", Math.max(sh, window.innerHeight) + "px");
  }
  fit();
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", function(){ setTimeout(fit, 300); });
})();
</script>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/Sortable.min.js"></script>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="backend.js"></script>
<script src="bundle.js"></script>
<script src="data.js"></script>
<script src="app-core.js"></script>
<script src="app-tarihler.js"></script>
<script src="app-ulasim.js"></script>
<script src="app-hazirlik.js"></script>
<script src="app-harcama.js"></script>
<script src="app-home.js"></script>
<script src="app-dialogs.js"></script>
<script>
(function(){
  var A = window.TPA, B = window.TPB, h = React.createElement;
  ReactDOM.createRoot(document.getElementById("root")).render(h(B.Gate, null, h(A.Root)));
  A.route();
  B.start(function(){ A.sync.connect(); });
  if("serviceWorker" in navigator && location.protocol === "https:"){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
})();
</script>
</body>
</html>
